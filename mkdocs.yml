site_name: "Programming the H100: CUDA, CuTe, and CUTLASS from First Principles"
site_description: >-
  A hardware-level companion guide to the NVIDIA Hopper architecture — from the
  H100 die and its memory hierarchy, through inline PTX, TMA, mbarrier pipelines
  and WGMMA tensor cores, up to warp-specialized kernel design, multi-GPU NCCL,
  Nsight profiling and CUTLASS/CuTe.
site_author: Oluwaseyi Awoga

# ---------------------------------------------------------------------------
# Change these two lines to match your own GitHub repository before deploying.
# ---------------------------------------------------------------------------
site_url: https://maximumbeings.github.io/programming-the-h100/
repo_url: https://github.com/maximumbeings/programming-the-h100
repo_name: maximumbeings/programming-the-h100
edit_uri: edit/main/docs/

copyright: Copyright &copy; Oluwaseyi Awoga

theme:
  name: material
  language: en
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css
  - stylesheets/code.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/fix_anchors.py
  - hooks/diagram_readability.py
  - hooks/reader_comments.py
  - hooks/code_formatting.py
  - hooks/chapter_redirects.py

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maximumbeings
  generator: true

