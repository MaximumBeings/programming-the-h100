   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.822113" transform="rotate(-0 360 37.822113)">Synchronous vs. Asynchronous Execution Model</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(73.31775 81.843344)">A100</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(61.146656 93.957406)">(Ampere)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(191.869766 82.216586)">Issue</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(192.66332 93.397406)">Load</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(296.893398 82.277016)">WAIT</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(296.629102 92.897367)">(idle)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="412.38" y="86.97393" transform="rotate(-0 412.38 86.97393)">Compute</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(506.149766 82.216586)">Issue</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(506.94332 93.397406)">Load</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(611.173398 82.277016)">WAIT</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(610.909102 92.897367)">(idle)</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="366.984" y="135.09225" transform="rotate(-0 366.984 135.09225)">Thread cannot proceed until the load returns -- memory latency stalls compute directly</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(73.002906 209.494844)">H100</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(62.419313 221.608906)">(Hopper)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(217.255625 204.9375)">Tell TMA:</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(205.36375 214.53125)">"copy tile i+1"</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(188.1275 224.93125)">(returns immediately)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(373.680625 209.3625)">Compute on tile i</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(350.33 219.73125)">(TMA works in background)</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="562.536" y="215.710313" transform="rotate(-0 562.536 215.710313)">Barrier</text>
   </g>
   <g id="text_13">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="412.38" y="262.74375" transform="rotate(-0 412.38 262.74375)">Memory latency is HIDDEN under compute, not just tolerated</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(184.612188 336.996406)">Why pipelined kernels (GEMMs, attention) approach the roofline on H100:</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(177.016641 349.346406)">fetch tile i+1 while computing tile i -- the TMA unit owns address generation,</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(183.234688 361.696406)">bounds checking and the transfer itself, so the SM core never blocks on it.</text>
   </g>
  </g>
 </g>
