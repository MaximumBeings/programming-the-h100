   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="37.891599" transform="rotate(-0 306 37.891599)">Warp Scheduler -- Per-Cycle Operation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(259.069219 96.716614)">1. SCAN all 16 warps</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(207.563906 108.759036)">(scoreboard, structural hazards, RAW/WAW)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(252.239062 174.207673)">2. SELECT 1 ready warp</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(265.414922 185.907673)">(priority heuristic)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(260.397422 252.570607)">3. FETCH instruction</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(225.313594 263.741153)">(L0 hit = immediate; L0 miss -&gt; L1)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(278.461406 329.982212)">4. DISPATCH</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(236.079141 340.88979)">to the matching functional unit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(256.045078 407.552724)">5. UPDATE scoreboard</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(218.007422 418.380849)">(destination marked pending -&gt; ready)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="439.484261" transform="rotate(-0 306 439.484261)">Rapidly switching between warps hides memory latency.</text>
   </g>
