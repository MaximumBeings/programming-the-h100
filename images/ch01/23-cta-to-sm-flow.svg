   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="37.784008" transform="rotate(-0 306 37.784008)">Thread Block (CTA) -&gt; SM Assignment</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(217.313016 97.47414)">GigaThread Engine finds an SM with free</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(231.812789 108.78414)">warp slots, registers, shared mem</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(190.352531 120.09414)">[Hopper] cluster constraint: adjacent SMs, same GPC</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="182.567882" transform="rotate(-0 306 182.567882)">SM receives the CTA, begins execution</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(225.784641 237.281398)">Hardware divides the CTA into warps</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(267.289758 248.922406)">(32 threads each)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(223.866562 297.649914)">Warps assigned to SMSPs round-robin</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(220.946625 308.959914)">(spread across all 4, not kept together)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="398.662601" transform="rotate(-0 306 398.662601)">__syncthreads() must coordinate warps across different SMSPs via shared-memory barrier logic.</text>
   </g>
  </g>
