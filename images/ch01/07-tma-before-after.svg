   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.743363" transform="rotate(-0 360 37.743363)">Copying a 64x64 Tile: Before and After TMA</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(122.883469 87.778664)">Before TMA (A100 and earlier)</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(188.892 96.357)"/>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(133.398234 110.067656)">Every thread in the warp:</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(110.681039 121.377656)">1. computes its own source address</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(100.753523 132.687656)">2. computes its own destination address</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.191055 144.840469)">3. issues a load</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(153.486398 156.150469)">4. issues a store</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(134.88607 166.617656)">5. repeats across the tile</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(493.542352 93.433664)">After TMA (H100)</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(531.108 102.012)"/>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(456.388594 116.565469)">One thread issues ONE instruction</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(458.731477 127.032656)">with a descriptor (base ptr, dims,</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(462.804164 138.342656)">strides, box size, element type,</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.154922 149.983664)">bounds). TMA hardware does the</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(480.404672 160.962656)">rest in the background.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="188.892" y="261.449344" transform="rotate(-0 188.892 261.449344)">~20,000+ warp instructions</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="531.108" y="262.652938" transform="rotate(-0 531.108 262.652938)">1 instruction</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(203.823281 339.227859)">Same 64x64 BF16 tile from a [4096,4096] matrix, row=128 col=256.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(174.396797 350.585438)">The TMA hardware generates all 4,096 underlying memory transactions internally.</text>
   </g>
  </g>
