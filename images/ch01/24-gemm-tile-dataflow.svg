   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="378" y="37.891599" transform="rotate(-0 378 37.891599)">One GEMM Tile, Start to Finish</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(326.736609 100.235415)">1. TMA descriptor setup</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(242.998813 111.415415)">CPU builds descriptor (base ptr, dims, strides, box) -&gt; PCIe 5.0</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(306.54475 177.726474)">2. Global -&gt; Shared (TMA, async)</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(224.288438 188.906474)">HBM3 -&gt; Memory Controller -&gt; L2 (50 MB) -&gt; Shared Memory (228 KB)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(329.559828 255.217533)">3. Shared -&gt; Registers</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(292.867391 266.397533)">Warp loads, 1 cycle if bank-conflict-free</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(320.735422 332.703889)">4. Compute (Tensor Cores)</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(212.126828 343.888592)">WGMMA: operands in, D = A x B + C out, 3,786-7,572 FLOPS/cycle/SM dense</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(296.022516 410.199651)">5. Registers -&gt; Shared -&gt; L2 -&gt; HBM3</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.044578 421.774041)">Write-back, L2 coalesces scattered writes into clean HBM bursts</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="378" y="446.112239" transform="rotate(-0 378 446.112239)">Steps 2 and 4 overlap for different tiles -- that overlap is the H100's core performance trick.</text>
   </g>
  </g>
