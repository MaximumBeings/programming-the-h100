   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="93.538313" transform="rotate(-0 306 93.538313)">CPU launches kernel via CUDA driver</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(248.895 150.998438)">Receive kernel descriptor</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(224.216719 162.698438)">(grid/block dims, shared mem, regs)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="306" y="221.030437" transform="rotate(-0 306 221.030437)">Create CTA work queue</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(221.932969 279.362437)">For each unstarted CTA: does any SM</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(216.757266 291.062437)">have free warp slots/regs/shared mem?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(223.247813 347.828437)">[Hopper] Cluster-aware: all CTAs in a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(226.885078 359.528437)">cluster must land on adjacent SMs,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(282.973359 372.020859)">same GPC</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(238.461328 427.994437)">CTA lands on an SM -&gt; begins</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(269.047969 439.694437)">executing warps</text>
   </g>
