   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.603363" transform="rotate(-0 360 37.603363)">Dynamic Shared Memory Layout for TMA — Wrong vs Correct Alignment</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="56.545088" y="87.344" transform="rotate(-0 56.545088 87.344)">WRONG</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(189.121166 84.757477)">mbar</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(188.909791 93.879555)">[0..7]</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(400.868491 84.757773)">data starts byte 8</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(408.108084 93.879258)">(8 % 128 ≠ 0)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(637.628963 77.981867)">✗ silent</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(637.628963 87.344)">corruption</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b5e20" x="56.545088" y="200.496" transform="rotate(-0 56.545088 200.496)">CORRECT</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(159.872361 197.909477)">mbar</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(159.660986 207.031555)">[0..7]</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(298.626132 197.909477)">padding [8..127]</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(308.432507 207.031555)">(120 bytes)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(523.57042 197.909477)">tile data [128..N]</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(530.718577 207.031555)">128B-aligned</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1b5e20" transform="translate(637.628963 191.133867)">✓ TMA</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1b5e20" transform="translate(637.628963 200.496)">writes here</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(189.972773 311.482)">data_offset = (sizeof(uint64_t) + 128 − 1) &amp; ~(128 − 1) = (8 + 127) &amp; ~127 = 128</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(54.381305 323.632)">TMA's 128-byte SWIZZLE_128B destination requirement is a hardware constraint, not a convention — get the offset wrong and the corruption is silent.</text>
   </g>
  </g>
