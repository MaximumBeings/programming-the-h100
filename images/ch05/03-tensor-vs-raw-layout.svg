   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(114.882578 228.575217)">With .tensor, TMA is handed a 128-byte descriptor and a coordinate — it derives strides, bounds, and swizzle itself.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(106.823516 241.325217)">Without it, TMA is handed only an address and a byte count: a hardware-accelerated memcpy with no notion of shape.</text>
   </g>
