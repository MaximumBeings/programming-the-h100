   </g>
   <g id="text_2">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(165.999242 103.743281)">Generic Proxy:</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(89.057594 114.533281)">ld.global [X] → V cached in L1 (reused on 2nd read)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(450.36925 103.8555)">Async Proxy (TMA, in between):</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(404.004875 114.2555)">cp.async.bulk [src]→[X] writes V' — L1 not invalidated!</text>
   </g>
   <g id="patch_5">
    <path d="M 658.309812 149.904 
Q 353.012739 149.904 47.715665 149.904 
" style="fill: none; stroke: #555555; stroke-linecap: round"/>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="353.016" y="169.776" transform="rotate(-0 353.016 169.776)">Time →</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(199.933813 225.50025)">Generic Proxy's 2nd read still returns stale V from L1 — it has no idea</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(249.006875 236.94025)">the Async Proxy updated X underneath it in L2.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(353.016 245.952)"/>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(198.991938 259.82025)">Fix (§13): mbarrier makes the TMA wait until the consumer signals it's</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(209.474938 271.26025)">done reading, instead of overwriting the buffer out from under it.</text>
   </g>
