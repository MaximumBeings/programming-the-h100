   <g id="text_12">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(191.944375 245.304507)">Base, LBO, SBO all store stride_bytes / 16 — the hardware re-multiplies by 16 on read.</text>
