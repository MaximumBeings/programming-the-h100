   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="266.357679" y="90.569293" transform="rotate(-0 266.357679 90.569293)">16 columns (BF16 tile)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(82.595089 256.84007)">16</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(76.191964 271.242414)">rows</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 125.975394)">Each lane POINTS to the start of its</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 143.412894)">row segment in SMEM — the hardware</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 162.012894)">SCATTERS the register values there.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 177.301644)"/>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 199.212894)">Address assignment matches</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 217.812894)">ldmatrix exactly: read a tile with</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 236.963206)">ldmatrix, write it back with stmatrix,</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 255.012894)">using the SAME address formula.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 270.301644)"/>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 292.212894)">Pointers are swizzle-mapped (128B</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 311.269456)">XOR, Ch.4 §6) so the 32 stores land</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.752679 330.575394)">in different banks — conflict-free.</text>
   </g>
  </g>
