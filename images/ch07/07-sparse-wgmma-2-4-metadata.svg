    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(425.126966 300.715705)">32-bit sp-meta register =</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(425.126966 316.815705)">8 quartets × 4 bits =</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(425.126966 334.029767)">K=64 worth of A elements</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.818955" y="395.273302" transform="rotate(-0 34.818955 395.273302)">3. sp-sel names which thread(s) in a 4-thread group hold that metadata</text>
   </g>
