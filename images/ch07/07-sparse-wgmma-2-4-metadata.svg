    <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(34.818955 555.67907)">Net effect: hardware reads metadata, fetches only the 2 named B rows per quartet,</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(34.818955 572.19907)">does 2 multiplies instead of 4 → 2× throughput.</text>
   </g>
