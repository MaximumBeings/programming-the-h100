   </g>
   <g id="text_37">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(24.613781 491.427799)">sp-sel selects</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(24.978984 504.150698)">which lane(s)</text>
   </g>
   <g id="text_38">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(269.003761 433.983151)">sp-sel is a compile-time constant with more than two valid values — the exact range</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(269.003761 450.783151)">and which lane(s) each value names depends on the shape and precision (m16n8k16:</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(269.003761 467.583151)">1-of-4 lanes, sel 0–3; m16n8k32: 2-of-4). Check the PTX ISA for your CUDA version</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(269.003761 484.383151)">rather than assuming a plain 0/1 choice.</text>
   </g>
