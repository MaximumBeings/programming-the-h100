    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="31.841379" y="296.088585" transform="rotate(-0 31.841379 296.088585)">Timeline — the Cooperative Gap:</text>
