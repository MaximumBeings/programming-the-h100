   <g id="text_1">
    <text style="font-weight: 700; font-size: 16.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="417.6" y="38.782885" transform="rotate(-0 417.6 38.782885)">Cooperative Pipeline — Tile Division and the Cooperative Gap</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="31.841379" y="58.348098" transform="rotate(-0 31.841379 58.348098)">One M=128×N=128 output tile, split by ROW between two consumer warpgroups:</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(264.05278 93.253325)">WG1 — Consumer 0</text>
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(284.45592 109.633325)">rows m=0..63</text>
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(280.897405 124.854716)">64 regs/thread</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(264.05278 152.688447)">WG2 — Consumer 1</text>
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(275.689077 169.068447)">rows m=64..127</text>
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(280.897405 184.289838)">64 regs/thread</text>
   </g>
