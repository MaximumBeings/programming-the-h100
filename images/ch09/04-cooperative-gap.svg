   <g id="text_5">
    <text style="font-style: italic; font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(72.205616 124.795714)">both WGs read the</text>
    <text style="font-style: italic; font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(95.371585 137.518613)">SAME A/B tiles</text>
    <text style="font-style: italic; font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(78.428148 150.241511)">from WG0's loads</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(561.649078 131.27212)">WG0 — Producer</text>
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(567.092672 146.382277)">TMA loads only</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.841379" y="231.559024" transform="rotate(-0 31.841379 231.559024)">Without cooperation: 1 WG needs 128 regs/thread for accumulators (barely fits).</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.841379" y="251.93678" transform="rotate(-0 31.841379 251.93678)">With cooperation: each WG needs only 64 — frees registers for a deeper pipeline.</text>
   </g>
