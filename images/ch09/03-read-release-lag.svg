   <g id="text_29">
    <text style="font-weight: 700; font-size: 12.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="24.405589" y="348.846171" transform="rotate(-0 24.405589 348.846171)">RELEASE ptr (red) confirms the PREVIOUS stage's WGMMA done, then signals EMPTY — always 1 step behind READ.</text>
   </g>
   <g id="text_30">
    <text style="font-style: italic; font-size: 11.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="24.405589" y="373.811657" transform="rotate(-0 24.405589 373.811657)">wgmma.wait_group&lt;1&gt; is what makes this safe: it waits until at most 1 group is still outstanding before releasing.</text>
   </g>
