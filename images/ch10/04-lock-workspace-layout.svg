   <g id="text_7">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00695c" x="93.752177" y="307.490087" transform="rotate(-0 93.752177 307.490087)">First split on tile T:   atomicAdd(&amp;lock[T], k_tile_count)  →  lock[T] = k_tile_count</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a5a00" x="93.752177" y="335.810504" transform="rotate(-0 93.752177 335.810504)">Middle split on tile T:  spin while lock[T] &lt; K_idx,  then atomicAdd(&amp;lock[T], k_tile_count)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="93.752177" y="364.130922" transform="rotate(-0 93.752177 364.130922)">Final split on tile T:   spin while lock[T] &lt; K_idx,  no further write — epilogue owns the tile</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="93.752177" y="415.377391" transform="rotate(-0 93.752177 415.377391)">Lock values ONLY INCREASE across the kernel's lifetime — once lock[T] == K_TILES_PER_OUTPUT,</text>
   </g>
   <g id="text_11">
    <text style="font-style: italic; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="93.752177" y="441.000626" transform="rotate(-0 93.752177 441.000626)">that tile's reduction is permanently done; there is no unlock and no decrement.</text>
   </g>
