    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a5a00" transform="translate(575.251325 229.297952)">park</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0d47a1" x="652.96011" y="225.06803" transform="rotate(-0 652.96011 225.06803)">run</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="31.956164" y="400.177895" transform="rotate(-0 31.956164 400.177895)">RESULT: Kernel B's cold-start (SM reservation, register alloc, weight prefetch) hides inside</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="31.956164" y="423.879158" transform="rotate(-0 31.956164 423.879158)">Kernel A's own tail. When Kernel A retires, Kernel B is already running — .wait releases immediately.</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.956164" y="464.509895" transform="rotate(-0 31.956164 464.509895)">NOTE: launch_dependents is a best-effort scheduling hint, not a hard real-time contract —</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.956164" y="488.211158" transform="rotate(-0 31.956164 488.211158)">if Kernel A finishes very quickly, Kernel B simply launches normally afterward, same as the top timeline.</text>
   </g>
