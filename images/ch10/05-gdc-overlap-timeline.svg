    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00695c" x="31.956164" y="247.812632" transform="rotate(-0 31.956164 247.812632)">WITH GDC — launch_dependents / .wait overlap</text>
