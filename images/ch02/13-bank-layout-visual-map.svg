    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="45.663158" y="187.369412" transform="rotate(-0 45.663158 187.369412)">highlighted cell: smem[32] (byte 128) wraps back to bank 0 — same bank as smem[0]</text>
   </g>
   <g id="text_38">
    <text style="font-style: italic; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="342" y="216.262588" transform="rotate(-0 342 216.262588)">Any two elements 32 floats apart land in the SAME bank — a stride-32 column access is a 32-way conflict</text>
