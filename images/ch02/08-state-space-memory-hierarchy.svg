   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="324" y="38.008626" transform="rotate(-0 324 38.008626)">State Space Map — Physical Location vs. Software View</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="324" y="68.360211" transform="rotate(-0 324 68.360211)">GPU Chip (H100)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="324" y="108.990947" transform="rotate(-0 324 108.990947)">SM (Streaming Multiprocessor)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(172.712203 160.666043)">Register File (.reg)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(164.484328 170.286043)">65536 × 32-bit per SM</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(175.656016 179.906043)">~1 cycle latency</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(376.525719 160.666043)">Shared Memory (.shared::cta)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(383.071828 170.625402)">228 KB, 32 banks × 32-bit</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(398.549391 179.906043)">~10 cycle latency</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(168.103969 247.287905)">Const Cache (.const)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(181.728641 256.56103)">64 KB per SM</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(163.730453 266.246359)">~10 cycles (broadcast)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(386.7435 252.097905)">L1 Data Cache (~48 KB)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(394.331391 261.436359)">caches .global loads</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(252.709625 358.686387)">L2 Cache (50 MB, shared across SMs)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(278.742 368.27723)">~100-200 cycle latency</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(265.580344 439.658704)">HBM3 (80 GB) — .global, .local</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(267.094406 449.538704)">3.35 TB/s, ~500 cycle latency</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="324" y="501.754737" transform="rotate(-0 324 501.754737)">__shared__ in CUDA C++ compiles to .shared::cta automatically — writing ld.shared explicitly in asm() bypasses that and controls the routing yourself</text>
   </g>
  </g>
 </g>
