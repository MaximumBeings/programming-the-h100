   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="309.6" y="79.572295" transform="rotate(-0 309.6 79.572295)">mykernel.cu  (CUDA C++)</text>
   </g>
   <g id="text_3">
    <text style="font-style: italic; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="420.781395" y="116.182286" transform="rotate(-0 420.781395 116.182286)">nvcc frontend</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(245.951187 166.507982)">mykernel.ptx  (PTX — Virtual ISA)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(309.6 174.290857)"/>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(256.093031 186.162295)">.version 8.0  .target sm_90a</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(260.870344 196.147982)">ld.param.u64 %rd1, [ptr];</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(262.610625 206.376513)">mov.u32 %r1, %tid.x;  ...</text>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="448.576744" y="248.76" transform="rotate(-0 448.576744 248.76)">ptxas (assembler)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(233.104812 304.025696)">mykernel.cubin  (SASS — Hardware ISA)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(309.6 311.808571)"/>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(267.332125 324.074853)">LDG.E R2, [R4+0x10];</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(244.954281 333.947134)">IMAD.MOV.U32 R5, RZ, RZ, R3;  ...</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="434.67907" y="381.337714" transform="rotate(-0 434.67907 381.337714)">driver loads cubin</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="309.6" y="430.585313" transform="rotate(-0 309.6 430.585313)">Execution on H100 hardware</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(162.933062 462.4)">PTX is STABLE across GPU generations (old PTX JIT-recompiles on new GPUs).</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(180.512219 474.454313)">SASS is HARDWARE-SPECIFIC (sm_90a SASS will not run on sm_80).</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(145.103344 486.72)">A shipped binary carries BOTH: SASS for the fast path, PTX as the future-GPU fallback.</text>
   </g>
  </g>
