   <g id="text_22">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle" x="534.6" y="77.76" transform="rotate(-0 534.6 77.76)">What SMEM looks like from inside the cluster</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(426.400828 141.319688)">Block 0 SMEM</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(435.571375 150.004063)">(228 KB)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(438.70825 159.519688)">Rank 0</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(450.792 166.01)"/>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(422.399344 177.719688)">Block 0 threads:</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(421.874344 186.141563)">read/write freely</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(580.048828 136.769688)">Block 1 SMEM</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(589.219375 145.454063)">(228 KB)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(592.35625 154.969688)">Rank 1</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(604.44 161.46)"/>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(576.047344 173.169688)">Block 0 threads:</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(573.436016 181.994609)">read/write/atomic</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(584.970703 191.369688)">via DSMEM</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(416.844563 232.005938)">ld.shared::cluster [addr] → hardware checks rank bits → routes to</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(430.67025 241.812)">the right SM's shared memory controller → ~50-80 cycles</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(402.240594 282.507125)">The scheduler GUARANTEES Block 0 and Block 1 co-run concurrently —</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(397.333469 293.607125)">neither is pre-empted while the other runs, so DSMEM accesses stay valid</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(496.404438 305.424)">for the whole kernel.</text>
   </g>
