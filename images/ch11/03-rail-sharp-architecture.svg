</g>
   <g id="text_11">
<text transform="translate(118.231383 353.757191)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.6" font-weight="700" font-style="normal" fill="#1b5e20">SHARP: in-switch aggregation of AllReduce partial sums</text>
<text transform="translate(108.215133 365.279816)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.6" font-weight="700" font-style="normal" fill="#1b5e20">(SHARPv3 — 32× more acceleration engines than prior gen)</text>
</g>
   <g id="text_12">
<text transform="translate(62.746383 388.310328)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.6" font-weight="400" font-style="normal" fill="#172033">Each of the 8 GPUs per node talks over its OWN dedicated rail (own NIC, own leaf switch) —</text>
<text transform="translate(57.623133 399.832953)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.6" font-weight="400" font-style="normal" fill="#172033">8 isolated communication planes with no cross-rail contention. SHARP performs the AllReduce</text>
<text transform="translate(53.051883 411.355578)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.6" font-weight="400" font-style="normal" fill="#172033">sum/max/min IN the switch silicon, so gradients are reduced without round-tripping to any GPU.</text>
</g>
   <g id="text_13">
<text transform="translate(7.2 18.977578)" font-family="Arial, Liberation Sans, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#172033">Scalable Unit: Rail Architecture + In-Network SHARP Reduction</text>
</g>
  </g>
 </g>
