<text transform="translate(74.52318 273.881098)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#0d47a1">leaf switch</text>
<text transform="translate(66.971977 284.202778)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#0d47a1">(64-port NDR)</text>
