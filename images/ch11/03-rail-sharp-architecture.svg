   <g id="text_1">
<text transform="translate(60.678633 83.427978)" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#0d47a1">32 × DGX H100 nodes (one Scalable Unit)</text>
</g>
   <g id="text_2">
<text transform="translate(60.678633 104.772378)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.8" font-weight="400" font-style="normal" fill="#555555">256 GPUs total — each node contributes 8 GPUs, one per rail</text>
</g>
