   <g id="text_8">
<text transform="translate(313.080352 263.558747)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#1b5e20">QM9700</text>
<text transform="translate(306.65118 273.881098)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#1b5e20">leaf switch</text>
<text transform="translate(299.099977 284.202778)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#1b5e20">(64-port NDR)</text>
</g>
   <g id="text_9">
<text transform="translate(428.695383 186.66702)" font-family="Arial, Liberation Sans, sans-serif" font-size="9" font-weight="700" font-style="normal" fill="#4527a0">Rail 7 …</text>
</g>
   <g id="text_10">
<text transform="translate(429.144352 263.558747)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#4527a0">QM9700</text>
<text transform="translate(422.71518 273.881098)" font-family="Arial, Liberation Sans, sans-serif" font-size="8.6" font-weight="700" font-style="normal" fill="#4527a0">leaf switch</text>
