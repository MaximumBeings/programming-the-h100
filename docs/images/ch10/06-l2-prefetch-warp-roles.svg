   <g id="text_1">
    <text style="font-weight: 700; font-size: 16.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="504" y="38.559381" transform="rotate(-0 504 38.559381)">L2 Prefetch Trick — Asymmetric Warp Roles Inside Kernel B</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; fill: #8a5a00" transform="translate(24.891429 124.605329)">Prefetch</text>
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; fill: #8a5a00" transform="translate(24.891429 138.527594)">warp</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; fill: #0d47a1" transform="translate(24.891429 238.993692)">Other</text>
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; fill: #0d47a1" transform="translate(24.891429 252.915958)">warps</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="215.125714" y="131.298313" transform="rotate(-0 215.125714 131.298313)">run_setup()</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(340.521897 124.812102)">issue TMA prefetch</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(350.252366 137.77304)">weight tile → L2</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(542.845982 125.780852)">.wait</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(539.528795 137.812102)">(park)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(665.132464 125.891727)">load activations</text>
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(645.813214 137.404227)">(weights already in L2)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="215.125714" y="245.686677" transform="rotate(-0 215.125714 245.686677)">run_setup()</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(351.717991 239.580935)">(no extra work —</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(369.021897 252.200466)">just waits)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(542.845982 240.169216)">.wait</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(539.528795 252.200466)">(park)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(656.130214 239.312591)">load act. + weights</text>
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(659.049964 252.146591)">(L2-hit, ~30-50ns)</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #616161" x="504" y="44.443636" transform="rotate(-0 504 44.443636)">overlap window ends — both warp roles park here</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="31.937143" y="374.151273" transform="rotate(-0 31.937143 374.151273)">Weight prefetch has no dependency on Kernel A's output, so it can run BEFORE .wait, during the</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="31.937143" y="397.701818" transform="rotate(-0 31.937143 397.701818)">overlap window — by the time .wait releases, the weight tile is already resident in L2, not HBM.</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.937143" y="431.345455" transform="rotate(-0 31.937143 431.345455)">Only helps when weights are reused enough to be worth caching, and the tile fits L2 without evicting other working sets.</text>
   </g>
  </g>
 </g>
