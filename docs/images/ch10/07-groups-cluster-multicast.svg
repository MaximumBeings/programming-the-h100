   <g id="text_9">
    <text style="font-style: italic; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="53.003077" y="168.925091" transform="rotate(-0 53.003077 168.925091)">Adjacent CTAs land on unrelated B columns → no shared cache lines, multicast can't help</text>
