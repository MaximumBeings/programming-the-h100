   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="53.003077" y="414.523636" transform="rotate(-0 53.003077 414.523636)">loads MULTICAST via TMA across the cluster — grid-wide L2 reuse of A-rows/B-columns is a secondary effect,</text>
   </g>
   <g id="text_21">
    <text style="font-style: italic; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="53.003077" y="438.074182" transform="rotate(-0 53.003077 438.074182)">not the primary mechanism; skewed (ungrouped) K-offsets break multicast eligibility entirely.</text>
