   <g id="text_1">
    <text style="font-weight: 700; font-size: 15.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="331.326563" y="38.86168" transform="rotate(-0 331.326563 38.86168)">wgmma.fence — Two Jobs, One Instruction</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="84.221639" transform="rotate(-0 68.157385 84.221639)">mbarrier.try_wait + acquire</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(68.157385 106.43317)">SMEM visibility for A/B tiles</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(68.157385 122.25317)">(mbarrier pipeline, not this fence)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="166.537275" transform="rotate(-0 68.157385 166.537275)">wgmma.fence.sync.aligned</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(68.157385 188.748806)">ROLE 1 — group-boundary marker:</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(68.157385 204.568806)">clean register state for the NEW group</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="248.852911" transform="rotate(-0 68.157385 248.852911)">wgmma.mma_async  (×K tiles)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="68.157385" y="278.974443" transform="rotate(-0 68.157385 278.974443)">the K-loop for one output tile</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="331.168548" transform="rotate(-0 68.157385 331.168548)">wgmma.commit_group</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="68.157385" y="361.290079" transform="rotate(-0 68.157385 361.290079)">seal the batch as Group G</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="413.484184" transform="rotate(-0 68.157385 413.484184)">… prepare next tile (TMA, pointers) …</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="68.157385" y="443.605716" transform="rotate(-0 68.157385 443.605716)">overlaps with Group G computing</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="495.79982" transform="rotate(-0 68.157385 495.79982)">wgmma.wait_group&lt;0&gt;</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="68.157385" y="525.921352" transform="rotate(-0 68.157385 525.921352)">stall until Group G’s math is done</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="578.115457" transform="rotate(-0 68.157385 578.115457)">wgmma.fence.sync.aligned</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(68.157385 600.326988)">ROLE 2 — register-hazard control:</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(68.157385 616.146988)">d[] writes now guaranteed visible</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="68.157385" y="660.431093" transform="rotate(-0 68.157385 660.431093)">read d[] / stmatrix …</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="68.157385" y="691.647312" transform="rotate(-0 68.157385 691.647312)">safe to consume the accumulator</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00695c" x="618.113487" y="183.849539" transform="rotate(-0 618.113487 183.849539)">Role 1</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00695c" x="618.113487" y="595.427721" transform="rotate(-0 618.113487 595.427721)">Role 2</text>
   </g>
   <g id="text_20">
    <text style="font-style: italic; font-size: 11.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(51.287566 738.830545)">Not what wgmma.fence does: order SMEM writes for A/B (that's mbarrier.acquire), or</text>
    <text style="font-style: italic; font-size: 11.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(51.287566 755.070545)">cross-proxy ordering between generic and async-proxy writes (that's fence.proxy.async).</text>
   </g>
