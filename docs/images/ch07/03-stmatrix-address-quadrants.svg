   <g id="text_8">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 122.072831)">Each lane POINTS to the start of its</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 134.569706)">row segment in SMEM — the hardware</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 147.899706)">SCATTERS the register values there.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 158.856644)"/>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 174.559706)">Address assignment matches</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 187.889706)">ldmatrix exactly: read a tile with</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 201.614097)">ldmatrix, write it back with stmatrix,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 214.549706)">using the SAME address formula.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 225.506644)"/>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 241.209706)">Pointers are swizzle-mapped (128B</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 254.866909)">XOR, Ch.4 §6) so the 32 stores land</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.428571 268.702831)">in different banks — conflict-free.</text>
   </g>
