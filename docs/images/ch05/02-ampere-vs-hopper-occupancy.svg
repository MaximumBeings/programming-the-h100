   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.677047" transform="rotate(-0 360 37.677047)">Ampere cp.async vs Hopper cp.async.bulk — Hardware Occupancy for a 4 KB Tile</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8a1c1c" x="207.78885" y="49.526905" transform="rotate(-0 207.78885 49.526905)">Ampere (sm_80) — cp.async</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(130.749287 104.480123)">256 cp.async calls × 128 threads</text>
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(143.785475 115.576185)">= ~32,768 instruction slots</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="207.78885" y="166.450648" transform="rotate(-0 207.78885 166.450648)">Warp schedulers — OCCUPIED (issuing)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="207.78885" y="206.512964" transform="rotate(-0 207.78885 206.512964)">LSU — BUSY (every 16B chunk)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="207.78885" y="241.463568" transform="rotate(-0 207.78885 241.463568)">Tensor Cores — IDLE (threads too busy)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b5e20" x="512.21115" y="49.526905" transform="rotate(-0 512.21115 49.526905)">Hopper (sm_90a) — cp.async.bulk</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(439.977806 104.480123)">1 cp.async.bulk call × 1 thread</text>
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(467.281564 116.106607)">= 1 instruction slot</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="512.21115" y="166.450648" transform="rotate(-0 512.21115 166.450648)">Warp schedulers — 1 issue, then free</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="512.21115" y="206.512964" transform="rotate(-0 512.21115 206.512964)">TMA engine — running independently</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="512.21115" y="241.463568" transform="rotate(-0 512.21115 241.463568)">Tensor Cores — RUNNING MATH, fully used</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(343.736133 138.677528)">32,768×</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(349.456641 147.679579)">fewer</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="291.236211" transform="rotate(-0 360 291.236211)">Ratio: 32,768× reduction in instruction overhead for the same 4 KB transfer — those freed instruction slots go directly to Tensor Core utilization.</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(97.598602 342.518211)">Ampere's cp.async still makes every thread compute its own address and issue its own copy (async only in that it doesn't block);</text>
    <text style="font-style: italic; font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(173.506359 354.668211)">Hopper's cp.async.bulk hands the whole block's transfer to one thread and the TMA engine.</text>
   </g>
  </g>
 </g>
