   <g id="text_2">
<text transform="translate(80.85233 328.748366)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.8" font-weight="400" font-style="normal" fill="#172033">Naive (3 separate kernels)</text>
</g>
   <g id="text_3">
<text transform="translate(315.142514 297.584665)" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#1b5e20">8.4 MB</text>
</g>
   <g id="text_4">
<text transform="translate(291.820905 328.748366)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.8" font-weight="400" font-style="normal" fill="#172033">Flash (fused, tiled)</text>
</g>
   <g id="text_5">
<text transform="translate(163.154096 65.947651)" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" font-style="normal" fill="#0d47a1">65× less</text>
<text transform="translate(155.240231 78.550522)" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" font-style="normal" fill="#0d47a1">HBM traffic</text>
</g>
   <g id="text_6">
<text transform="translate(42.518117 361.781524)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.1" font-weight="400" font-style="normal" fill="#555555">Useful input/output is 8.4 MB either way (Q, K, V in; O out) — the naive form just writes</text>
<text transform="translate(32.173266 372.704013)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.1" font-weight="400" font-style="normal" fill="#555555">S and P to HBM as intermediates that never needed to exist there. S alone is 134 MB at this</text>
<text transform="translate(94.062508 383.626501)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.1" font-weight="400" font-style="normal" fill="#555555">size; the H100&#x27;s entire L2 is 50 MB, so it cannot even be cached.</text>
</g>
   <g id="text_7">
<text transform="translate(60.345422 18.637221)" font-family="Arial, Liberation Sans, sans-serif" font-size="13.3" font-weight="700" font-style="normal" fill="#172033">Naive Attention vs FlashAttention — HBM Traffic</text>
<text transform="translate(113.614 34.600857)" font-family="Arial, Liberation Sans, sans-serif" font-size="13.3" font-weight="700" font-style="normal" fill="#172033">(N=8192, d=128, BF16, one head)</text>
</g>
