   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="324" y="37.359885" transform="rotate(-0 324 37.359885)">The Classic "Tile and Compute" Pattern</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start" x="69.96" y="96.423652" transform="rotate(-0 69.96 96.423652)">Global Memory [input array, size N]</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #00695c" x="275.28" y="142.528696" transform="rotate(-0 275.28 142.528696)">Thread block's tile (128 elements)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(379.68 160.09545)">each thread loads 1 element,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(379.68 168.874435)">then all threads barrier sync</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00695c" x="69.96" y="208.393043" transform="rotate(-0 69.96 208.393043)">Shared Memory [smem, 128 × 4 bytes = 512 bytes]</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="324" y="277.550609" transform="rotate(-0 324 277.550609)">entire tile is here, fast to read — each thread then reads several SMEM elements instead of hitting global memory directly</text>
   </g>
  </g>
 </g>
