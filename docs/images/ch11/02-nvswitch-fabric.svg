   <g id="text_9">
<text transform="translate(61.995516 239.123195)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">NVSwitch</text>
<text transform="translate(84.247039 250.52505)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">0</text>
</g>
   <g id="text_10">
<text transform="translate(186.987516 239.123195)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">NVSwitch</text>
<text transform="translate(209.239039 250.52505)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">1</text>
</g>
   <g id="text_11">
<text transform="translate(311.979516 239.123195)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">NVSwitch</text>
<text transform="translate(334.231039 250.52505)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">2</text>
</g>
   <g id="text_12">
<text transform="translate(436.971516 239.123195)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">NVSwitch</text>
<text transform="translate(459.223039 250.52505)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="700" font-style="normal" fill="#8a5a00">3</text>
</g>
   <g id="text_13">
<text transform="translate(71.23375 273.624241)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">Every GPU connects to every NVSwitch (18 NVLink lanes per GPU, 50 GB/s each).</text>
<text transform="translate(78.149375 285.626975)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">Any GPU → any GPU path crosses exactly one switch hop — fully non-blocking,</text>
<text transform="translate(98.220469 297.629709)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">same bandwidth and latency for every pair. This is why NCCL topology</text>
<text transform="translate(101.44 309.632444)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">detection on an NVSwitch node can treat the fabric as a flat all-to-all,</text>
<text transform="translate(99.659531 321.635178)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">unlike a PCIe-only or partial-mesh topology where paths differ by pair.</text>
</g>
   <g id="text_14">
<text transform="translate(74.538984 382.619178)" font-family="Arial, Liberation Sans, sans-serif" font-size="9" font-weight="400" font-style="italic" fill="#555555">(DGX H100: 4× third-generation NVSwitch, each also doing in-network SHARP reduction)</text>
</g>
   <g id="text_15">
<text transform="translate(15.084414 18.977578)" font-family="Arial, Liberation Sans, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#172033">NVSwitch Fabric — All 8 GPUs Equidistant via 4 NVSwitches</text>
</g>
  </g>
 </g>
