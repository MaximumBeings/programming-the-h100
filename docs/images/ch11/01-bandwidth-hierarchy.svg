   <g id="text_1">
<text transform="translate(79.0704 55.663626)" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#0d47a1">HBM3 (on-package)</text>
</g>
   <g id="text_2">
<text transform="translate(79.0704 72.49521)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#555555">3.35 TB/s per GPU</text>
</g>
   <g id="text_3">
<text transform="translate(416.331709 62.249898)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="400" font-style="italic" fill="#555555">fastest</text>
</g>
   <g id="text_4">
<text transform="translate(79.0704 121.526346)" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#0d47a1">NVLink 4 (GPU ↔ GPU, via NVSwitch)</text>
</g>
   <g id="text_5">
<text transform="translate(79.0704 138.35793)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#555555">450 GB/s per direction  (900 GB/s bidir)</text>
</g>
   <g id="text_6">
<text transform="translate(79.0704 187.389066)" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8a5a00">PCIe Gen5 (GPU ↔ CPU)</text>
</g>
   <g id="text_7">
<text transform="translate(79.0704 204.22065)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#555555">~64 GB/s per direction</text>
</g>
   <g id="text_8">
<text transform="translate(79.0704 253.251786)" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8a5a00">ConnectX-7 (node ↔ node, NDR InfiniBand)</text>
</g>
   <g id="text_9">
<text transform="translate(79.0704 270.08337)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#555555">50 GB/s per direction per NIC</text>
</g>
   <g id="text_10">
<text transform="translate(79.0704 319.114506)" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#b71c1c">InfiniBand fabric (rack ↔ rack)</text>
</g>
   <g id="text_11">
<text transform="translate(79.0704 335.94609)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#555555">50 GB/s per NIC</text>
</g>
   <g id="text_12">
<text transform="translate(413.000772 325.700778)" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-weight="400" font-style="italic" fill="#555555">slowest</text>
</g>
   <g id="text_13">
<text transform="translate(58.536 377.731244)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">Ratio NVLink → ConnectX-7: 450 / 50 = 9× bandwidth drop leaving the node.</text>
<text transform="translate(58.536 389.733978)" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#172033">Everything in the software stack below is designed to minimize inter-node traffic.</text>
</g>
