<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="1100" height="660" viewBox="0 0 1100 660" role="img"><title>H100 SXM memory hierarchy: capacity, bandwidth and scope</title><desc>Registers, shared memory, L2 cache and HBM3, with scope made explicit. The shared-memory rate is a theoretical scalar bank model.</desc>
