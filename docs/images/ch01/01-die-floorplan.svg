    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="378" y="453.692933" transform="rotate(-0 378 453.692933)">50 MB L2 Cache  —  2 × 25 MB partitions, 128B lines / 32B sectors</text>
   </g>
   <g id="text_18">
