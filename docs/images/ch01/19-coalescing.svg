   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="342" y="37.653363" transform="rotate(-0 342 37.653363)">Coalesced vs. Uncoalesced Warp Memory Access</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(134.047914 80.520473)">BEST CASE -- coalesced</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(185.115789 88.494286)"/>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(110.296461 102.441739)">32 threads, consecutive addresses</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(125.242993 113.545817)">0x1000, 0x1004, ... 0x107C</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(185.115789 122.034286)"/>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(124.971555 136.420473)">All fit in 1 x 128B cache line</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(143.704102 147.600473)">-&gt; 1 L2 transaction</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(444.381623 80.520473)">WORST CASE -- uncoalesced</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(505.856842 88.494286)"/>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(431.83167 102.441739)">32 threads, stride-128B addresses</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(444.884186 113.545817)">0x1000, 0x1080, 0x1100, ...</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(505.856842 122.034286)"/>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(455.28817 136.420473)">32 different cache lines</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(459.469248 147.600473)">-&gt; 32 L2 transactions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="345.486316" y="233.639741" transform="rotate(-0 345.486316 233.639741)">Same 128 bytes moved either way -- 32x difference in L2 transactions issued</text>
   </g>
