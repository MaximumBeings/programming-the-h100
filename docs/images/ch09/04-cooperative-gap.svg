   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="417.6" y="38.081412" transform="rotate(-0 417.6 38.081412)">Cooperative Pipeline — Tile Division and the Cooperative Gap</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="31.841379" y="58.348098" transform="rotate(-0 31.841379 58.348098)">One M=128×N=128 output tile, split by ROW between two consumer warpgroups:</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(283.876123 96.622981)">WG1 — Consumer 0</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(298.449795 108.322981)">rows m=0..63</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(295.907998 119.195403)">64 regs/thread</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(283.876123 156.058103)">WG2 — Consumer 1</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(292.187764 167.758103)">rows m=64..127</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(295.907998 178.630525)">64 regs/thread</text>
   </g>
   <g id="patch_13">
    <path d="M 186.144828 77.328386 
Q 186.144828 134.763655 186.144828 192.198924 
" style="fill: none; stroke: #616161; stroke-width: 1.2; stroke-linecap: round"/>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(100.482491 127.61712)">both WGs read the</text>
    <text style="font-style: italic; font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(117.092054 136.739199)">SAME A/B tiles</text>
    <text style="font-style: italic; font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(104.943929 145.861277)">from WG0's loads</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(578.606484 132.269995)">WG0 — Producer</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(582.494766 143.062964)">TMA loads only</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.841379" y="231.559024" transform="rotate(-0 31.841379 231.559024)">Without cooperation: 1 WG needs 128 regs/thread for accumulators (barely fits).</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.841379" y="251.93678" transform="rotate(-0 31.841379 251.93678)">With cooperation: each WG needs only 64 — frees registers for a deeper pipeline.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1c1c" x="31.841379" y="296.088585" transform="rotate(-0 31.841379 296.088585)">Timeline — the Cooperative Gap:</text>
   </g>
