<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="1100" height="470" viewBox="0 0 1100 470" role="img"><title>WGMMA 64-bit descriptor with correct base-offset field</title><desc>Address bits 0–13, leading offset 16–29, stride offset 32–45, base offset 49–51, swizzle 62–63. Remaining bits are reserved.</desc>
<metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
