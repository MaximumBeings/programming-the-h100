   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.822113" transform="rotate(-0 360 37.822113)">128B Swizzle — XORing Row Bits Into Bank Bits</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="360" y="54.47025" transform="rotate(-0 360 54.47025)">linear_offset = row × 128 + col × 2        mask = ((linear_offset &gt;&gt; 7) &amp; 0x7) &lt;&lt; 4        smem_ptr = (base + linear_offset) ^ mask</text>
   </g>
