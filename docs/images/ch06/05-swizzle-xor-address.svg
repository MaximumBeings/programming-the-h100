   <g id="text_23">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(196.723031 388.5711)">Every row gets a different mask → a different bank shift for the same column.</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(174.528 401.14485)">No two rows collide in the same bank — the XOR is what makes the access conflict-free.</text>
