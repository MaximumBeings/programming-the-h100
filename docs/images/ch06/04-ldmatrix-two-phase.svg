   <g id="text_26">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(184.767609 383.848335)">Critical insight: the thread that PROVIDES an address in Phase 1 is not the thread</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(178.328359 395.028335)">that RECEIVES that data in Phase 2. Thread 0 points to row 0's memory, but threads</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(217.791609 406.208335)">0-3 all receive parts of row 0 — the hardware reshuffles internally.</text>
   </g>
