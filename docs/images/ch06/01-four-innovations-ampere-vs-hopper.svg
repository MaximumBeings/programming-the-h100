   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.743363" transform="rotate(-0 360 37.743363)">The Four Hopper MMA Innovations — What Each One Fixes</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8a1c1c" x="293.652" y="67.716" transform="rotate(-0 293.652 67.716)">Ampere (mma.sync)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b5e20" x="566.028" y="67.716" transform="rotate(-0 566.028 67.716)">Hopper (wgmma.mma_async)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="28.26" y="118.678184" transform="rotate(-0 28.26 118.678184)">1. Async math</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(231.51825 113.539344)">BLOCKING — thread stalls until</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(246.646375 123.141531)">result lands in registers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(493.673 113.539344)">NON-BLOCKING — issue &amp; move on;</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(511.743625 123.141531)">hardware queues the math</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="28.26" y="183.629384" transform="rotate(-0 28.26 183.629384)">2. Execution unit</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8a1c1c" x="293.652" y="183.291637" transform="rotate(-0 293.652 183.291637)">1 warp (32 threads) per mma.sync</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(508.173625 178.490544)">1 warp GROUP (128 threads)</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(501.211125 188.092731)">per wgmma — 4× the data/instr</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="28.26" y="248.580584" transform="rotate(-0 28.26 248.580584)">3. Data path</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(240.1845 243.441744)">global → SMEM → registers</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(232.41075 253.043931)">→ mma.sync (register staging)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(501.652375 243.441744)">global → SMEM → wgmma reads</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(512.398625 253.043931)">SMEM directly (no staging)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="28.26" y="313.531784" transform="rotate(-0 28.26 313.531784)">4. Precision/sparsity</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(236.3545 308.392944)">No native FP8; no structured</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(257.691375 317.995131)">sparsity hardware</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(496.59925 308.392944)">FP8 (E4M3/E5M2) + 2:4 structured</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(503.75425 317.995131)">sparsity, first-class instructions</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(169.235875 357.992803)">Combined effect: ≈312 TFLOPS BF16 dense (A100) → ≈1,979 TFLOPS FP8 dense (H100).</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(165.298688 369.7056)">H100's own BF16 figure is already ≈989 TFLOPS — architecture alone is most of the jump.</text>
   </g>
  </g>
 </g>
