   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.699915" transform="rotate(-0 360 37.699915)">The Two Proxies</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(162.221445 91.730243)">GENERIC PROXY</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(195.876 99.499172)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(125.680695 112.579454)">Who: the executing thread (warp)</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(129.046734 123.369454)">What: ordinary ld/st instructions</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(129.090828 134.963516)">Path: Thread → L1 → L2 → HBM3</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(195.876 142.659172)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(123.198477 155.739454)">Ordered per-thread, program order</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(495.029258 91.730243)">ASYNC PROXY</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(524.124 99.499172)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(450.785719 112.579454)">Who: TMA engine / tensor core unit</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(462.761063 123.369454)">What: cp.async.bulk, wgmma</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(450.956258 134.159454)">Path: TMA → L2 → HBM3 (skips L1!)</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(524.124 142.659172)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(453.652461 155.739454)">Runs independently of any thread</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(190.983516 270.594058)">Generic Proxy writes → land in L1 — MAY NOT be visible to the Async Proxy</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(190.983516 282.294058)">Async Proxy writes → land in L2 — MAY NOT be visible to the Generic Proxy</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(360 291.510621)"/>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(192.507188 305.694058)">The two proxies do not share a coherency domain by default — an explicit</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(206.350313 317.394058)">fence (§7) is what bridges them when they touch the same address.</text>
   </g>
  </g>
 </g>
