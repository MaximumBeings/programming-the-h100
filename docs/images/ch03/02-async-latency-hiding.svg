   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="164.448" y="99.673469" transform="rotate(-0 164.448 99.673469)">Fetch A — issued, runs in background</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="248.256" y="152.921469" transform="rotate(-0 248.256 152.921469)">Fetch B — issued immediately after</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="321.588" y="99.731984" transform="rotate(-0 321.588 99.731984)">Compute A</text>
   </g>
