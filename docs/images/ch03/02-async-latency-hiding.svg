   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="360" y="54.064" transform="rotate(-0 360 54.064)">Fetching and computing now overlap — both proxies stay busy</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(212.228219 270.639406)">Total time ≈ max(all fetches) + a little compute overhead</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(218.373531 282.989406)">vs. synchronous: sum(all fetches) + sum(all computes)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(147.876109 295.339406)">This is why TMA + mbarrier + wgmma exist: so the Tensor Cores never have to wait.</text>
   </g>
