   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.549517" transform="rotate(-0 360 37.549517)">Two-Barrier WAR Prevention — Producer / Consumer Handshake</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(172.533375 80.35505)">data_bar</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(125.413453 93.052082)">"Has data arrived from TMA?"</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(501.492094 80.35505)">release_bar</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(456.253031 92.180207)">"Are consumers done reading?"</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(158.929 174.158808)">Producer thread:</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(135.540875 183.672558)">wait(release_bar) → proceed</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(139.274 194.072558)">arrive.expect_tx(data_bar)</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(146.732125 204.583808)">cp.async.bulk → smem</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(492.611 173.313183)">Consumer warps:</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(476.349125 183.672558)">wait(data_bar) → proceed</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(482.5835 194.183808)">compute on smem tile</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(473.806 204.472558)">arrive.release(release_bar)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #00695c" transform="translate(290.343313 96.276582) rotate(-354)">consumer waits on data_bar</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #2e7d32" transform="translate(290.343313 175.258854) rotate(-354)">producer waits on release_bar</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="360" y="296.346462" transform="rotate(-0 360 296.346462)">Producer never overwrites a tile until release_bar says every consumer is done reading it</text>
   </g>
  </g>
 </g>
