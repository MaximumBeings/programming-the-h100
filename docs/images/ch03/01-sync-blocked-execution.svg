   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="318.096" y="167.216" transform="rotate(-0 318.096 167.216)">Time →</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="360" y="50.736" transform="rotate(-0 360 50.736)">Only ONE of {fetching, computing} happens at any instant</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(148.809711 251.152406)">In H100 terms: fetching ≈ moving a tile HBM3 → SMEM (~200–500 ns).</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(190.951117 263.502406)">Computing ≈ one Tensor Core tile multiply (~1–5 ns).</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(154.1735 275.852406)">The fetch is 100–500× slower than the compute — so a synchronous</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(172.296977 288.202406)">kernel leaves the Tensor Cores idle essentially all of the time.</text>
   </g>
