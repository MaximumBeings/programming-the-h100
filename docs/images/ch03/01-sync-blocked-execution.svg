   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="360" y="37.603363" transform="rotate(-0 360 37.603363)">The Synchronous World — Blocked Execution</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(126.786234 104.817313)">Fetch A</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a1c1c" transform="translate(103.307484 115.645438)">(blocked, waiting)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="272.7" y="109.715984" transform="rotate(-0 272.7 109.715984)">Compute A</text>
   </g>
   <g id="text_4">
