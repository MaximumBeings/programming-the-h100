name: Deploy site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ github.sha }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reject unregistered pending source changes
        run: python3 tools/test_pending_revalidation.py

      - name: Verify published execution records
        run: python3 tools/verify_validation_records.py

      - name: Verify fresh audit evidence
        run: python3 tools/verify_final_audit.py

      - name: Verify eight-A100 supplemental evidence
        run: python3 tools/verify_eight_gpu_audit.py

      - name: Verify November 18 rerun
        run: python3 tools/verify_revalidation.py

      - name: Verify current CuTe/CUTLASS workshop execution
        run: python3 tools/verify_workshop.py

      - name: Check new advanced collector without executing CUDA
        run: |
          bash -n tools/fetch_cutlass.sh
          python3 -m py_compile tools/run_advanced_validation.py
          python3 tools/run_advanced_validation.py --cutlass /tmp/not-required-for-plan --output /tmp/advanced-plan-only

      - name: Verify introductory stride arithmetic
        run: python3 docs/examples/advanced/stride_walkthrough.py

      - name: Verify attention arithmetic and result classification without a GPU
        run: |
          python3 docs/examples/advanced/attention_walkthrough.py
          python3 tools/verify_attention_walkthrough.py
          python3 tools/verify_attention_source.py
          python3 tools/verify_attention_h100.py
          clang++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -DATTENTION_HOST_ONLY docs/examples/attention/attention_online.cu -o /tmp/ch30-attention-host
          /tmp/ch30-attention-host
          python3 tools/tests/test_cutlass_attention.py
          python3 tools/tests/test_attention_evidence.py
          python3 -m py_compile tools/run_cutlass_attention.py
          python3 tools/run_cutlass_attention.py --help

      - name: Verify SVG readability
        run: python3 tools/verify_svg_readability.py

      - name: Build strictly
        run: mkdocs build --strict

      - name: Verify reader comment presentation
        run: python3 tools/verify_reader_comments.py --site-dir site

      - name: Verify built internal links
        run: python3 tools/verify_site_links.py

      - name: Verify displayed source formatting
        run: python3 tools/verify_code_formatting.py --site-dir site

      - name: Deploy
        run: mkdocs gh-deploy --force
