name: Deploy site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ github.sha }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify published execution records
        run: python3 tools/verify_validation_records.py

      - name: Verify fresh audit evidence
        run: python3 tools/verify_final_audit.py

      - name: Verify SVG readability
        run: python3 tools/verify_svg_readability.py

      - name: Build strictly
        run: mkdocs build --strict

      - name: Verify built internal links
        run: python3 tools/verify_site_links.py

      - name: Deploy
        run: mkdocs gh-deploy --force
